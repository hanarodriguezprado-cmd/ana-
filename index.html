<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mis Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Mis Gastos</h1>
  </header>

  <main>
    <section class="summary card">
      <div class="summary-main">
        <span class="summary-label">Gastado este mes</span>
        <span class="summary-amount" id="monthTotal">0,00&nbsp;€</span>
      </div>
      <div class="breakdown" id="breakdown"></div>
    </section>

    <section class="filters">
      <div class="chips" id="categoryChips"></div>
      <select id="periodFilter" class="period-select">
        <option value="month">Este mes</option>
        <option value="all">Todo</option>
      </select>
    </section>

    <section class="list-section">
      <ul id="expenseList" class="expense-list"></ul>
      <p id="emptyState" class="empty-state">Todavía no has añadido ningún gasto.</p>
    </section>
  </main>

  <button id="addBtn" class="fab" aria-label="Añadir gasto">+</button>

  <div id="modalOverlay" class="modal-overlay hidden">
    <form id="expenseForm" class="modal">
      <h2>Nuevo gasto</h2>

      <label>
        Importe (€)
        <input type="number" id="amountInput" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
      </label>

      <label>
        Categoría
        <select id="categoryInput" required></select>
      </label>

      <label>
        Fecha
        <input type="date" id="dateInput" required>
      </label>

      <label>
        Nota (opcional)
        <input type="text" id="noteInput" placeholder="Ej. Cena con amigos" maxlength="80">
      </label>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
