<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Mis Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Mis Gastos</h1>
    <div class="tabs" id="viewTabs">
      <button class="tab active" data-view="general" type="button">General</button>
      <button class="tab" data-view="vinted" type="button">👕 Vinted</button>
    </div>
  </header>

  <main>
    <section class="summary card">
      <div class="summary-main">
        <span class="summary-label" id="summaryLabel">Gastado este mes</span>
        <span class="summary-amount" id="monthTotal">0,00&nbsp;€</span>
      </div>
      <div class="summary-secondary">
        <div class="stat-mini">
          <span class="summary-label" id="incomeLabel">Ingresado</span>
          <span id="monthIncome">0,00&nbsp;€</span>
        </div>
        <div class="stat-mini">
          <span class="summary-label">Balance</span>
          <span id="monthBalance">0,00&nbsp;€</span>
        </div>
      </div>
      <div class="breakdown" id="breakdown"></div>
    </section>

    <section class="filters">
      <div class="chips" id="categoryChips"></div>
      <select id="periodFilter" class="period-select">
        <option value="month">Este mes</option>
        <option value="all">Todo</option>
      </select>
    </section>

    <section class="list-section">
      <ul id="expenseList" class="expense-list"></ul>
      <div id="vintedHistory" class="vinted-history"></div>
      <p id="emptyState" class="empty-state">Todavía no has añadido ningún movimiento.</p>
    </section>
  </main>

  <div id="fabStack" class="fab-stack">
    <button id="sharedBtn" class="fab fab-secondary hidden" aria-label="Añadir compra compartida">🤝</button>
    <button id="addBtn" class="fab" aria-label="Añadir movimiento">+</button>
  </div>

  <div id="sharedModalOverlay" class="modal-overlay hidden">
    <form id="sharedForm" class="modal">
      <h2>Compra compartida</h2>
      <p class="modal-hint">Pon los totales completos: se dividen a la mitad automáticamente y esa mitad es la que se añade a tu Vinted.</p>

      <label>
        Prenda
        <input type="text" id="sharedItemInput" placeholder="Ej. Cazadora Levi's" maxlength="80" required>
      </label>

      <label>
        Total de la compra (€)
        <input type="number" id="sharedBuyInput" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
      </label>

      <label>
        Fecha de la compra
        <input type="date" id="sharedBuyDateInput" required>
      </label>

      <label>
        Total de la venta (€) <span class="label-optional">— déjalo en blanco si aún no se ha vendido</span>
        <input type="number" id="sharedSellInput" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
      </label>

      <label id="sharedSellDateLabel">
        Fecha de la venta
        <input type="date" id="sharedSellDateInput">
      </label>

      <div class="shared-preview" id="sharedPreview"></div>

      <div class="modal-actions">
        <button type="button" id="sharedCancelBtn" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <form id="expenseForm" class="modal">
      <h2 id="modalTitle">Nuevo movimiento</h2>

      <label>
        Tipo
        <div class="segmented" id="typeToggle">
          <button type="button" class="seg-btn active" data-type="gasto">Gasto</button>
          <button type="button" class="seg-btn" data-type="ingreso">Ingreso</button>
        </div>
      </label>

      <label>
        Importe (€)
        <input type="number" id="amountInput" inputmode="decimal" step="0.01" min="0" placeholder="0,00" required>
      </label>

      <label id="categoryLabel">
        Categoría
        <select id="categoryInput" required></select>
      </label>

      <label>
        Fecha
        <input type="date" id="dateInput" required>
      </label>

      <label id="noteLabel">
        Nota (opcional)
        <input type="text" id="noteInput" placeholder="Ej. Cena con amigos" maxlength="80">
      </label>

      <div class="modal-actions">
        <button type="button" id="cancelBtn" class="btn-secondary">Cancelar</button>
        <button type="submit" class="btn-primary">Guardar</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
